plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }
configurations.all {
    resolutionStrategy.force "androidx.core:core:1.16.0"
    resolutionStrategy.force "androidx.core:core-ktx:1.16.0"
}

android {
    namespace "com.tomasthrawat.hyoukazombiesurvival"
    compileSdk 35
    defaultConfig {
        applicationId "com.tomasthrawat.hyoukazombiesurvival"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    packaging { resources.excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"] }
}
dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
}
